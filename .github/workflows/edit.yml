name: edit

# webapp(SSWC の論文ストック)から workflow_dispatch で起動される。スタッフの自撮り動画を編集して、ATHCON ドライブの完成フォルダへ入れる。
# 公開リポジトリなので、入力は jobId(ランダムな UUID)だけ。台本・ファイル ID はジョブ取得 API から署名つきで取る。
# ログには固定の進み具合の文と数値だけを出す。
on:
  workflow_dispatch:
    inputs:
      jobId:
        description: 編集ジョブの ID
        required: true
        type: string

permissions:
  contents: read

# concurrency は付けない: 同じ group だと待っている実行が黙って取り消される。実行どうしは作業フォルダもドライブのファイルも別なので、並んで動いてよい

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 準備の失敗を通知する最後の手順でも使う
      JOB_ID: ${{ inputs.jobId }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Node が TypeScript を直接読めることを確認する
        run: |
          node -e "if (!process.features.typescript) { console.error('Node 22.18 以上が必要です'); process.exit(1) }"

      - name: ffmpeg と Remotion に必要なライブラリ、日本語の書体を入れる
        run: |
          sudo apt-get update
          if ! command -v ffmpeg >/dev/null; then sudo apt-get install -y ffmpeg; fi
          sudo apt-get install -y build-essential libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f

      # 開発用のもの(vitest・typescript)は使わないので入れない
      - run: npm ci --omit=dev

      # whisper の medium モデル(約 1.5GB)だけを保存しておく。whisper.cpp の本体は実行機の CPU に合わせて毎回ビルドする
      - uses: actions/cache@v4
        with:
          path: whisper-models
          key: whisper-model-medium-${{ runner.os }}

      # Remotion が使う Chrome(chrome-headless-shell)
      - uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 編集してドライブへ入れる
        id: edit
        env:
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          SSWC_SELF_DRIVE_DONE_FOLDER_ID: ${{ secrets.SSWC_SELF_DRIVE_DONE_FOLDER_ID }}
          SSWC_SELF_DRIVE_ASSETS_FOLDER_ID: ${{ secrets.SSWC_SELF_DRIVE_ASSETS_FOLDER_ID }}
          SSWC_VIDEO_SECRET: ${{ secrets.SSWC_VIDEO_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
          # whisper のモデルの置き場所(上の actions/cache と同じ)
          WHISPER_MODEL_DIR: whisper-models
          WHISPER_MODEL: medium
          # Remotion の書き出しの並列数(多いと描画が失敗することがある)
          RENDER_CONCURRENCY: "2"
        run: node scripts/ci-run.mjs

      # ci-run が最終の通知を届けられなかったとき(準備の失敗・時間切れ・取り消しなど)だけ、失敗を通知する。
      # ci-run が具体的な理由つきで通知済みなら動かさない(理由を上書きしないため)
      - name: 失敗を通知する
        if: (failure() || cancelled()) && steps.edit.outputs.notified != 'true'
        env:
          SSWC_VIDEO_SECRET: ${{ secrets.SSWC_VIDEO_SECRET }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: node scripts/ci-notify-failed.mjs
